[project]
name = "sp-risk-engine"
version = "0.1.0"
description = "AI/NLP risk engine with sentiment-driven rebalancer and credit stress test"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "riskengine"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
