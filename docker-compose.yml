services:
  demo:
    build: .
    image: riskengine
    command: ["python", "run_demo.py"]

  api:
    image: riskengine
    depends_on:
      demo:
        condition: service_completed_successfully
    # site = the API under /api plus the dashboard at / (http://localhost:8000)
    command: ["uvicorn", "riskengine.site:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
