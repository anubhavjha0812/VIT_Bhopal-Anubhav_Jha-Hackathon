# Which version of each part to run.
# Defaults are our fine-tuned int8 models (DECISIONS E11); set finbert / keywords for the baselines.

sentiment = "entity"     # finbert | own | entity (E27, per-company, text pair; own is the fallback)
events = "model_rules"   # keywords | model | model_rules (E24 candidate C, chosen on D2, final-tested)
impact = "learned"       # formula | learned (E28: adds move_score; the 1-10 impact stays the formula)
rebalancer = "sentiment" # equal | sentiment (equal weight is always run as the benchmark)
shock = "flat"           # flat | scaled
rates = "moved"          # fixed | moved (E22: Treasury moves with the episode, parallel shift)

impact_trigger = 7       # Module B runs on events with impact above this

# Replay window (inclusive). Basic version: where 2020 tweets and FNSPID news overlap.
window_start = 2020-04-09
window_end = 2020-06-10
