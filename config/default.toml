# Which version of each part to run.
# Defaults are the simple baselines; upgrades are switched on as they are built.

sentiment = "finbert"    # finbert | own
events = "keywords"      # keywords | model
impact = "formula"       # formula | learned
rebalancer = "sentiment" # equal | sentiment (equal weight is always run as the benchmark)
shock = "flat"           # flat | scaled

impact_trigger = 7       # Module B runs on events with impact above this

# Replay window (inclusive). Basic version: where 2020 tweets and FNSPID news overlap.
window_start = 2020-04-09
window_end = 2020-06-10